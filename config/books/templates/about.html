<!DOCTYPE html>
<html lang="en">
<body>
    
<h3>Siin hoitakse raamatuid.</h3>

{% for raamat in raamatud %}
    <h2>{{ raamat.pealkiri }}</h2>
    <p>Autor: {{ raamat.autor }}</p>
    {% if raamat.saadavus == True %}
    <p>Saadavus: True</p>
    {% else %}
    <p>Saadavus: False</p>
    {% endif %}
{% endfor %}

</body>
</html>
